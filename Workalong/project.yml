name: Workalong
options:
  bundleIdPrefix: com.wonkwh
  developmentLanguage: ko
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: AEVQL949E2
targets:
  Workalong:
    type: application
    platform: iOS
    sources: [Workalong]
    entitlements:
      path: Workalong/Workalong.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.com.wonkwh.Workalong]
    dependencies:
      - target: WorkalongShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonkwh.Workalong
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Workalong
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: 마친 운동을 건강 앱에 기록해요
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  WorkalongShare:
    type: app-extension
    platform: iOS
    # 공유 확장이 루틴을 만들 때 쓰는 모델 파일만 함께 빌드한다
    sources:
      - ShareExtension
      - Workalong/Routine.swift
      - Workalong/VideoSource.swift
      - Workalong/IntervalRun.swift
      - Workalong/Health.swift
      - Workalong/DesignSystem/Theme.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Workalong
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/WorkalongShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.wonkwh.Workalong]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonkwh.Workalong.Share
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  WorkalongTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WorkalongTests]
    dependencies:
      - target: Workalong
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Workalong:
    build:
      targets:
        Workalong: all
    test:
      targets: [WorkalongTests]
