name: PlainFocusTask
options:
  bundleIdPrefix: com.wonkwh
  developmentLanguage: ko
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: AEVQL949E2
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  PlainFocusTask:
    type: application
    platform: macOS
    sources: [PlainFocusTask]
    entitlements:
      path: PlainFocusTask/PlainFocusTask.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.personal-information.calendars: true
    info:
      path: PlainFocusTask/Info.plist
      properties:
        CFBundleDisplayName: PlainFocusTask
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        NSRemindersFullAccessUsageDescription: 미리 알림을 개요로 가져오거나 개요 항목을 미리 알림으로 내보냅니다.
        NSRemindersUsageDescription: 미리 알림을 개요로 가져오거나 개요 항목을 미리 알림으로 내보냅니다.
        CFBundleDocumentTypes:
          - CFBundleTypeName: TaskPaper Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes: [com.hogbaysoftware.taskpaper.document]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).OutlineDocument
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).OutlineDocument
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.hogbaysoftware.taskpaper.document
            UTTypeDescription: TaskPaper Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [taskpaper, todo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonkwh.PlainFocusTask
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  PlainFocusTaskTests:
    type: bundle.unit-test
    platform: macOS
    # 모델만 직접 컴파일해 호스트 앱 없이 빠르게 돈다
    sources:
      - PlainFocusTaskTests
      - PlainFocusTask/Model
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonkwh.PlainFocusTaskTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PlainFocusTask:
    build:
      targets:
        PlainFocusTask: all
        PlainFocusTaskTests: [test]
    test:
      targets: [PlainFocusTaskTests]
