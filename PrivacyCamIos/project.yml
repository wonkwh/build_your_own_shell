name: PrivacyCam
options:
  bundleIdPrefix: com.wonkwh
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: AEVQL949E2
    CODE_SIGN_STYLE: Automatic
targets:
  PrivacyCam:
    type: application
    platform: iOS
    sources: [PrivacyCam]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonkwh.privacycam
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PrivacyCam
        INFOPLIST_KEY_NSCameraUsageDescription: 가릴 사진을 촬영합니다. 사진은 기기 밖으로 나가지 않습니다.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 개인정보를 가린 사본을 사진 앱에 저장합니다.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        COREML_CODEGEN_LANGUAGE: None
  PrivacyCamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PrivacyCamTests
      - path: PrivacyCam.storekit
        buildPhase: resources
    dependencies:
      - target: PrivacyCam
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PrivacyCam:
    build:
      targets:
        PrivacyCam: all
        PrivacyCamTests: [test]
    run:
      storeKitConfiguration: PrivacyCam.storekit
    test:
      targets: [PrivacyCamTests]
